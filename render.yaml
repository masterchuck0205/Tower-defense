# Render Blueprint: New + > Blueprint, pick this repository.
services:
  - type: web
    name: stone-and-crown-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: stone-crown-db
          property: connectionString
databases:
  - name: stone-crown-db
    plan: free
